name: Build reverse-mode Mullvad driver (Windows)

concurrency:
  group: reverse-driver-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - reverse-split-tunneling-windows
    paths:
      - 'recipes/win-split-tunnel/patches/**'
      - '.github/workflows/build-reverse-driver.yml'
  workflow_dispatch:

jobs:
  build-driver-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout Amnezia fork
        uses: actions/checkout@v4

      - name: Set up 64-bit MSBuild
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (!(Test-Path $vswhere)) { throw "vswhere.exe was not found: $vswhere" }
          $vs = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath
          if (!$vs) { throw 'Visual Studio MSBuild installation was not found.' }
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\amd64\MSBuild.exe'
          if (!(Test-Path $msbuild)) { throw "64-bit MSBuild was not found: $msbuild" }
          "MSBUILD_EXE=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using 64-bit MSBuild: $msbuild"

      - name: Install complete Windows Driver Kit
        shell: pwsh
        run: |
          winget install --id Microsoft.WindowsWDK.10.0.26100 --exact --silent --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw "Windows Driver Kit installation failed with exit code $LASTEXITCODE" }

      - name: Set up Visual Studio developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download pinned Mullvad 1.3.0.0 source
        shell: pwsh
        run: |
          $sourceCommit = '0a0eb97f67d1dbcb3d08bda66d3b24f465d95475'
          $archive = Join-Path $env:RUNNER_TEMP 'win-split-tunnel.zip'
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'win-split-tunnel'
          Invoke-WebRequest -Uri "https://github.com/mullvad/win-split-tunnel/archive/$sourceCommit.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $sourceRoot
          $extracted = Join-Path $sourceRoot "win-split-tunnel-$sourceCommit"
          "DRIVER_SOURCE=$extracted" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply reverse-mode driver patch
        shell: pwsh
        run: |
          python recipes/win-split-tunnel/patches/apply_reverse_mode_patch.py "$env:DRIVER_SOURCE"

      - name: Prepare WDK INF verifier
        shell: pwsh
        run: |
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $target = Join-Path $kits 'build\10.0.26100.0\x86'
          $verifier = Get-ChildItem -Path $kits -Filter 'InfVerif.dll' -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -ieq 'x86' } |
            Select-Object -First 1
          if (!$verifier) {
            throw 'The x86 WDK InfVerif.dll was not found. Refusing to report a driver build with skipped INF validation as successful.'
          }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          if ([IO.Path]::GetFullPath($verifier.Directory.FullName).TrimEnd('\\') -ine [IO.Path]::GetFullPath($target).TrimEnd('\\')) {
            Copy-Item (Join-Path $verifier.Directory.FullName '*') $target -Recurse -Force
          }
          if (!(Test-Path (Join-Path $target 'InfVerif.dll'))) {
            throw 'InfVerif.dll was not installed into the WDK build-tools directory.'
          }
          Write-Host "Prepared x86 INF verifier files from $($verifier.Directory.FullName)"

      - name: Build unsigned x64 driver
        shell: pwsh
        run: |
          $project = Join-Path $env:DRIVER_SOURCE 'src\mullvad-split-tunnel.vcxproj'
          & "$env:MSBUILD_EXE" $project /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /verbosity:minimal 2>&1 | Tee-Object -FilePath driver-build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) { throw "MSBuild failed with exit code $buildExitCode. Check that the Windows Driver Kit is available on this runner." }
          if (Select-String -Path driver-build.log -Pattern 'INF verification exception|error C[0-9]+|fatal error' -Quiet) {
            throw 'MSBuild reported a driver or INF verification error even though its exit code was zero.'
          }

      - name: Collect driver package
        shell: pwsh
        run: |
          $candidate = Join-Path $env:DRIVER_SOURCE 'bin\x64-Release\mullvad-split-tunnel'
          if (!(Test-Path $candidate)) {
            $candidate = Get-ChildItem -Path $env:DRIVER_SOURCE -Directory -Recurse |
              Where-Object { Test-Path (Join-Path $_.FullName 'mullvad-split-tunnel.sys') } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$candidate) { throw 'Built driver package directory was not found.' }
          New-Item -ItemType Directory -Force -Path 'driver-artifact' | Out-Null
          foreach ($name in @('mullvad-split-tunnel.sys','mullvad-split-tunnel.inf','mullvad-split-tunnel.cat','mullvad-split-tunnel.pdb')) {
            $file = Join-Path $candidate $name
            if (Test-Path $file) { Copy-Item $file 'driver-artifact' }
          }
          if (!(Test-Path 'driver-artifact\mullvad-split-tunnel.sys')) { throw 'SYS output is missing.' }
          if (!(Test-Path 'driver-artifact\mullvad-split-tunnel.inf')) { throw 'INF output is missing.' }

          # Keep the complete corresponding modified source and upstream license texts
          # with every development binary package.
          Copy-Item (Join-Path $env:DRIVER_SOURCE 'LICENSE-GPL.md') 'driver-artifact\LICENSE-GPL.md'
          Copy-Item (Join-Path $env:DRIVER_SOURCE 'LICENSE-MPL.txt') 'driver-artifact\LICENSE-MPL.txt'
          Copy-Item 'recipes\win-split-tunnel\patches\apply_reverse_mode_patch.py' 'driver-artifact\apply_reverse_mode_patch.py'
          $sourceArchive = Join-Path $env:RUNNER_TEMP 'win-split-tunnel-1.3.0.0-amnezia-source.zip'
          Compress-Archive -Path (Join-Path $env:DRIVER_SOURCE '*') -DestinationPath $sourceArchive -Force
          Copy-Item $sourceArchive 'driver-artifact\win-split-tunnel-1.3.0.0-amnezia-source.zip'

          Get-ChildItem 'driver-artifact' | Format-Table Name,Length

      - name: Upload unsigned development driver
        uses: actions/upload-artifact@v4
        with:
          name: reverse-mode-driver-x64-unsigned
          path: driver-artifact/*
          if-no-files-found: error
          retention-days: 7      - name: Prepare WDK INF verifier for x64 MSBuild
        shell: pwsh
        run: |
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $target = Join-Path $kits 'build\bin\x64'
          $verifier = Get-ChildItem -Path $kits -Filter 'InfVerif.dll' -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -ieq 'x64' } |
            Select-Object -First 1
          if (!$verifier) {
            throw 'The x64 WDK InfVerif.dll was not found. The driver build will not skip INF validation.'
          }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          if ([IO.Path]::GetFullPath($verifier.Directory.FullName).TrimEnd('\') -ine [IO.Path]::GetFullPath($target).TrimEnd('\')) {
            Copy-Item (Join-Path $verifier.Directory.FullName '*') $target -Recurse -Force
          }
          if (!(Test-Path (Join-Path $target 'InfVerif.dll'))) {
            throw 'InfVerif.dll was not installed into the x64 WDK build-tools directory.'
          }
          Write-Host "Prepared x64 INF verifier files from $($verifier.Directory.FullName)"

      - name: Build unsigned x64 driver
        shell: pwsh
        run: |
          $project = Join-Path $env:DRIVER_SOURCE 'src\mullvad-split-tunnel.vcxproj'
          msbuild $project /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /verbosity:minimal 2>&1 | Tee-Object -FilePath driver-build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) { throw "MSBuild failed with exit code $buildExitCode. Check that the Windows Driver Kit is available on this runner." }
          if (Select-String -Path driver-build.log -Pattern 'INF verification exception|error C[0-9]+|fatal error' -Quiet) {
            throw 'MSBuild reported a driver or INF verification error even though its exit code was zero.'
          }

      - name: Collect driver package
        shell: pwsh
        run: |
          $candidate = Join-Path $env:DRIVER_SOURCE 'bin\x64-Release\mullvad-split-tunnel'
          if (!(Test-Path $candidate)) {
            $candidate = Get-ChildItem -Path $env:DRIVER_SOURCE -Directory -Recurse |
              Where-Object { Test-Path (Join-Path $_.FullName 'mullvad-split-tunnel.sys') } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$candidate) { throw 'Built driver package directory was not found.' }
          New-Item -ItemType Directory -Force -Path 'driver-artifact' | Out-Null
          foreach ($name in @('mullvad-split-tunnel.sys','mullvad-split-tunnel.inf','mullvad-split-tunnel.cat','mullvad-split-tunnel.pdb')) {
            $file = Join-Path $candidate $name
            if (Test-Path $file) { Copy-Item $file 'driver-artifact' }
          }
          if (!(Test-Path 'driver-artifact\mullvad-split-tunnel.sys')) { throw 'SYS output is missing.' }
          if (!(Test-Path 'driver-artifact\mullvad-split-tunnel.inf')) { throw 'INF output is missing.' }

          # Keep the complete corresponding modified source and upstream license texts
          # with every development binary package.
          Copy-Item (Join-Path $env:DRIVER_SOURCE 'LICENSE-GPL.md') 'driver-artifact\LICENSE-GPL.md'
          Copy-Item (Join-Path $env:DRIVER_SOURCE 'LICENSE-MPL.txt') 'driver-artifact\LICENSE-MPL.txt'
          Copy-Item 'recipes\win-split-tunnel\patches\apply_reverse_mode_patch.py' 'driver-artifact\apply_reverse_mode_patch.py'
          $sourceArchive = Join-Path $env:RUNNER_TEMP 'win-split-tunnel-1.3.0.0-amnezia-source.zip'
          Compress-Archive -Path (Join-Path $env:DRIVER_SOURCE '*') -DestinationPath $sourceArchive -Force
          Copy-Item $sourceArchive 'driver-artifact\win-split-tunnel-1.3.0.0-amnezia-source.zip'

          Get-ChildItem 'driver-artifact' | Format-Table Name,Length

      - name: Upload unsigned development driver
        uses: actions/upload-artifact@v4
        with:
          name: reverse-mode-driver-x64-unsigned
          path: driver-artifact/*
          if-no-files-found: error
          retention-days: 7
